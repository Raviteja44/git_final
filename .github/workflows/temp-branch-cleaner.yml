name: 4. Cleanup Temp Branches

permissions:
  contents: write  # Required for deleting remote branches

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean temp branches
        run: |
          echo "Fetching all remote branches..."
          git fetch --all --prune

          # Improved regex to match all temp promotion branches
          BRANCHES=$(git branch -r | grep -E "origin/promote-[^/]+-to-[^/]+-" | sed 's|origin/||')

          if [[ -z "$BRANCHES" ]]; then
            echo "No temp branches to delete."
            exit 0
          fi

          echo "Found temp branches to delete:"
          echo "$BRANCHES"
          
          # Optional: Dry-run confirmation (comment out if not needed)
          # echo "Dry-run: these branches would be deleted."
          # exit 0

          for BR in $BRANCHES; do
            echo "Deleting temp branch: $BR"
            git push origin --delete "$BR" || echo "Warning: branch $BR may already be deleted"
          done

          echo "Cleanup complete."
