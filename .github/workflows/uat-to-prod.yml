name: 3. UAT to Prod Promotion

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      pr_id:
        description: "PR ID merged into uat"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Validate PR merged into uat
        run: |
          MERGED=$(gh pr view ${{ github.event.inputs.pr_id }} --json baseRefName --jq .baseRefName)
          if [[ "$MERGED" != "uat" ]]; then
            echo "ERROR: PR #${{ github.event.inputs.pr_id }} was not merged into uat. Sequential promotion violated."
            exit 1
          fi
          echo "PR #${{ github.event.inputs.pr_id }} validated as merged into uat."

      - name: Create temp promotion branch
        id: prep
        run: |
          TEMP="promote-uat-to-prod-${{ github.event.inputs.pr_id }}-$(date +%Y%m%d_%H%M%S)"
          
          # Checkout prod and pull latest
          git checkout prod
          git pull origin prod
          
          # Create temp branch and merge uat
          git checkout -b "$TEMP"
          git merge --no-ff origin/uat
          
          # Push temp branch to origin
          git push origin "$TEMP"
          
          echo "temp=$TEMP" >> $GITHUB_OUTPUT
          echo "Temporary promotion branch created: $TEMP"

      - name: Collect diff and commit metadata
        id: diff
        run: |
          FILES=$(git diff --name-only origin/prod..origin/uat)
          COUNT=$(echo "$FILES" | grep -v '^$' | wc -l)
          MSG=$(git log --pretty=format:"%h %s" origin/prod..origin/uat)
          
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.prep.outputs.temp }}
          base: prod
          title: "Promote uat → prod PR ID#${{ github.event.inputs.pr_id }}"
          body: |
            Reference PR ID (uat merge): **${{ github.event.inputs.pr_id }}**
            
            **Files Changed (count = ${{ steps.diff.outputs.count }})**
            ```
            ${{ steps.diff.outputs.files }}
            ```

            **Commit Messages**
            ```
            ${{ steps.diff.outputs.messages }}
            ```
          labels: promote-to-prod
