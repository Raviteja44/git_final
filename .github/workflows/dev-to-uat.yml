name: 2. Dev to UAT Promotion

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      pr_id:
        description: "PR ID that was merged into dev"
        required: true
        type: string

jobs:
  promote:
    name: Promote dev → uat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Validate PR merged into dev
        run: |
          # Get the base branch of the PR
          MERGED=$(gh pr view ${{ github.event.inputs.pr_id }} --json baseRefName --jq .baseRefName)
          if [[ "$MERGED" != "dev" ]]; then
            echo "ERROR: PR #${{ github.event.inputs.pr_id }} was not merged into dev. Sequential promotion violated."
            exit 1
          fi
          echo "PR #${{ github.event.inputs.pr_id }} validated as merged into dev."

      - name: Create temp promotion branch
        id: prep
        run: |
          TEMP="promote-dev-to-uat-${{ github.event.inputs.pr_id }}-$(date +%Y%m%d_%H%M%S)"
          
          # Checkout UAT and pull latest changes
          git checkout uat
          git pull origin uat
          
          # Create temp branch and merge dev
          git checkout -b "$TEMP"
          git merge --no-ff origin/dev
          
          # Push temp branch to origin
          git push origin "$TEMP"
          
          echo "temp=$TEMP" >> $GITHUB_OUTPUT
          echo "Temporary promotion branch created: $TEMP"

      - name: Collect diff and commit metadata
        id: diff
        run: |
          FILES=$(git diff --name-only origin/uat..origin/dev)
          COUNT=$(echo "$FILES" | grep -v '^$' | wc -l)
          MSG=$(git log --pretty=format:"%h %s" origin/uat..origin/dev)
          
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.prep.outputs.temp }}
          base: uat
          title: "Promote dev → uat PR ID#${{ github.event.inputs.pr_id }}"
          body: |
            PR ID for uat → prod reference: **${{ github.event.inputs.pr_id }}**
            
            **Files Changed (count = ${{ steps.diff.outputs.count }})**
            ```
            ${{ steps.diff.outputs.files }}
            ```

            **Commit Messages**
            ```
            ${{ steps.diff.outputs.messages }}
            ```
          labels: promote-to-uat
