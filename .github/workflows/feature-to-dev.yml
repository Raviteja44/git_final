name: 1. Feature to Dev Promotion

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: "Select the feature branch to promote (must start with feature/)"
        type: choice
        required: true
        options:
          - feature/sample  # placeholder; user must type/choose a valid feature branch manually

jobs:
  promote:
    name: Promote feature → dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List feature/* branches
        id: list_branches
        run: |
          git fetch --all --prune
          FEAT=$(git branch -r | grep "origin/feature/" | sed 's|origin/||')
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$FEAT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Available feature branches:"
          echo "$FEAT"

      - name: Validate selected branch is feature/*
        run: |
          if [[ "${{ github.event.inputs.feature_branch }}" != feature/* ]]; then
            echo "ERROR: You must select a feature/* branch."
            exit 1
          fi

      - name: Prepare temp promotion branch
        id: prepare
        run: |
          FB="${{ github.event.inputs.feature_branch }}"
          TEMP="promote-${FB//\//-}-to-dev-$(date +%Y%m%d_%H%M%S)"

          git checkout dev
          git pull origin dev

          git checkout -b "$TEMP"
          git merge --no-ff "origin/$FB" || true
          git push origin "$TEMP"

          echo "temp_branch=$TEMP" >> $GITHUB_OUTPUT

      - name: Collect diff metadata
        id: diff
        run: |
          git fetch origin dev
          git fetch origin "${{ github.event.inputs.feature_branch }}"

          FILES=$(git diff --name-only origin/dev...origin/${{ github.event.inputs.feature_branch }})
          COUNT=$(echo "$FILES" | grep -v '^$' | wc -l)
          MSGS=$(git log --pretty=format:"%h %s" origin/dev..origin/${{ github.event.inputs.feature_branch }})

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$MSGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.prepare.outputs.temp_branch }}
          base: dev
          title: "Promote ${{ github.event.inputs.feature_branch }} → dev PR ID#AUTO"
          body: |
            PR ID (dev → uat reference): **AUTO_GENERATED**
            
            **Files Changed (count = ${{ steps.diff.outputs.count }})**
            ```
            ${{ steps.diff.outputs.files }}
            ```

            **Commit Messages**
            ```
            ${{ steps.diff.outputs.messages }}
            ```

          labels: promote-to-dev
