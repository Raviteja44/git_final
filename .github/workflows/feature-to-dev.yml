name: 1. Feature to Dev Promotion

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:  # No inputs — branch is selected via “Use workflow from”
  
jobs:
  promote:
    name: Promote feature → dev
    runs-on: ubuntu-latest

    steps:
      - name: Validate that workflow is triggered from a feature/* branch
        run: |
          BR="${GITHUB_REF_NAME}"
          echo "Triggered from branch: $BR"

          if [[ "$BR" != feature/* ]]; then
            echo "ERROR: This workflow can only be triggered from a feature/* branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare temp promotion branch
        id: prepare
        run: |
          FB="${GITHUB_REF_NAME}"
          TEMP="promote-${FB//\//-}-to-dev-$(date +%Y%m%d_%H%M%S)"

          git fetch origin
          git checkout dev
          git pull origin dev

          git checkout -b "$TEMP"
          git merge --no-ff "origin/$FB" || true
          git push origin "$TEMP"

          echo "temp_branch=$TEMP" >> $GITHUB_OUTPUT

      - name: Collect diff metadata
        id: diff
        run: |
          FB="${GITHUB_REF_NAME}"

          git fetch origin dev
          git fetch origin "$FB"

          FILES=$(git diff --name-only origin/dev...origin/$FB)
          COUNT=$(echo "$FILES" | grep -v '^$' | wc -l)
          MSGS=$(git log --pretty=format:"%h %s" origin/dev..origin/$FB)

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$MSGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.prepare.outputs.temp_branch }}
          base: dev
          title: "Promote ${{ github.ref_name }} → dev PR ID#AUTO"
          body: |
            PR ID (dev → uat reference): **AUTO_GENERATED**
            
            **Files Changed (count = ${{ steps.diff.outputs.count }})**
            ```
            ${{ steps.diff.outputs.files }}
            ```

            **Commit Messages**
            ```
            ${{ steps.diff.outputs.messages }}
            ```

          labels: promote-to-dev
